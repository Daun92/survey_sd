<div id="ol-summary" class="cards"{% if oob %} hx-swap-oob="true"{% endif %}>
  <div class="card"><div class="v">{{ summary.total }}</div><div class="k">이상치 후보</div></div>
  <div class="card"><div class="v">{{ summary.pending }}</div><div class="k">미결</div></div>
  <div class="card"><div class="v">{{ summary.resolved }}</div><div class="k">검토 완료</div></div>
  <div class="card">
    <div class="v">{{ summary.pending_by_sev.critical }}/{{ summary.pending_by_sev.high }}/{{ summary.pending_by_sev.medium }}</div>
    <div class="k">미결 critical/high/medium</div>
  </div>
</div>
