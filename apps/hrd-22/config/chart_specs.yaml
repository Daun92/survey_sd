# 22회 도표 사양 (chart_specs) — v1 초안
# 자동 생성: workspace/gen_chart_specs.py
# 출처: 21회 분석가이드 도표 인벤토리 + codebook_22th(export 교정본) 변수 매핑
# 검증: 0_survey/chart_var_mapping_22th.md / docs/SEGMENT_RULE_VERIFICATION_21th.md

# ── 세그먼트 정의 (가이드 분석기준 + 21회 김태웅 산출 검증 결과) ──
segment_defs:
  size_tier:   # 가이드 표시 기준 = 3단계 + 전체 + 공공. 5계산구간을 roll-up.
    display: [전체, "1000이상", "300-999", "299이하", 공공]
    rollup:  # segments.yaml 5구간 → 표시 3단계
      "299이하":  ["100미만", "100-300"]
      "300-999":  ["300-500", "500-1000"]
      "1000이상": ["1000이상"]
    source_col: "p1)R_1_2_2"   # 전체 직원 수
  major_industry:   # 가이드: 모수 많은 순 10개 이상 업종을 개별 분석
    rule: "재분류 후 최종 카운트 10명 이상 업종을 개별 시트로 (21회=8개)"
    note: "21회는 raw가 아닌 수기 재분류 후 카운트 기준 적용. 22회 선정은 정제 확정 후 재계산 필요."
    ref_21th: [전자, 자동차, 에너지, 패션, 의료, 금융, IT, 교육]
    source_col: "R_Cate"
  public:
    rule: "R_Div=4 → 공공기관, R_Div=5 → 공공기타(학교)"
  top3_only:
    rule: "분포 상위 3개 항목만 그래프 표기 (도표35 등). 집계는 overall과 동일, 표시 단계에서 상위3 절단."
    base: overall

