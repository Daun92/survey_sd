# 21회 ↔ 22회 변수명 매핑
#
# 22회 웹앱이 Page 1 + p5)R_8 변수 슬롯을 21회와 다르게 재배정함.
# (배경: 0_survey/export_alignment_22th.md, docs/...)
# 출처: workspace/regen_codebook_export_order.py 의 content_source 외부화.
#
# 키 = 22회 export 이름, 값 = 21회 이름.
# round_adapter.py 가 이를 역전(21→22)해 21회 데이터를 22회 이름으로 변환.
# meta·p2·p3·p4 는 양 라운드 동일하므로 매핑 불필요(여기 없음).

var_map_22_to_21:
  "p1)R_3_n_2": "p1)R_2_n_2"        # 2. 교육비 증감
  "p1)R_4_multi": "p1)R_3_multi"    # 2-2) 증가 이유
  "p1)R_4_etc": "p1)R_3_etc"
  "p1)R_6_multi": "p1)R_4_multi"    # 2-3) 감소 이유
  "p1)R_6_etc": "p1)R_4_etc"
  "p1)R_7_1_2": "p1)R_5_1_2"        # 3. 교육 시간 (이름 충돌 케이스)
  "p1)R_9_1_2": "p1)R_6_1_2"        # 4. 교육 인원 비율
  "p1)R_9_1_3": "p1)R_6_1_3"
  "p1)R_9_1_4": "p1)R_6_1_4"
  "p1)R_9_1_5": "p1)R_6_1_5"
  "p1)R_9_1_6": "p1)R_6_1_6"
  "p1)R_9_1_7": "p1)R_6_1_7"
  "p1)R_11_1_2": "p1)R_7_1_2"       # 5-1) 지출 비율 (이름 충돌 케이스)
  "p1)R_11_1_3": "p1)R_7_1_3"
  "p1)R_11_1_4": "p1)R_7_1_4"
  "p1)R_11_1_5": "p1)R_7_1_5"
  "p1)R_11_1_6": "p1)R_7_1_6"
  "p1)R_11_1_7": "p1)R_7_1_7"
  "p1)R_11_1_8": "p1)R_7_1_8"
  "p1)R_11_1_9": "p1)R_7_1_9"
  "p1)R_12_1_2": "p1)R_8_1_2"       # 5-2) 직책별 지출
  "p1)R_12_1_3": "p1)R_8_1_3"
  "p1)R_12_1_4": "p1)R_8_1_4"
  "p1)R_12_1_5": "p1)R_8_1_5"
  "p1)R_13_multi": "p1)R_11_multi"  # 5-4) AI 비율 (21회 미존재 → 변환 시 결손)
  "p1)R_14_multi": "p1)R_10_multi"  # 6. 투자 효과
  "p5)R_8_1_2": "p5)R_8_1_3"        # AI 교육 만족도
  "p5)R_8_2_2": "p5)R_8_2_3"        # AI 교육 현업활용도

# 21회 native 이지만 22회에서 삭제된 변수(rename 시 22회 이름과 충돌) → 어댑터가 drop.
#   p1)R_9_1_* (21회=공공 직급별 지출, I-5-3, 22회 삭제) ← 22회 R_9_1_*(교육인원비율)과 이름 충돌
# 어댑터는 "22회 타깃이면서 매핑 소스가 아닌 21회 컬럼"을 자동 탐지해 drop하므로 별도 목록 불요.
