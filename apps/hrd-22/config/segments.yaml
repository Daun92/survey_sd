# 22회 김태웅 형식 집계 — 세그먼트·구간 정의
#
# scripts/stage4_build_kim_xlsx.py 가 이 yaml 을 읽고 16시트를 생성.
# v1 범위: 전체 + 인력규모 5시트 + 공공 1 = 7시트.
# v2 (후속): 산업 10시트 — R_Cate 한글 라벨 + R_Cate_Name 기반 분석가 수기 재분류 보조.

# ─────────────────────────────────────────────
# 응답자 필터 (모집단 정의)
# ─────────────────────────────────────────────
population_filter:
  # 합의 명세 docs/POPULATION_FILTER_SPEC_22th.md (2026-05-20):
  # 기업(주 분석)과 공공(별도 집계) 분리. 매출은 비필수(공공·대학 면제).
  corporate:                       # 기업 모집단 (R_Div 1·2·3)
    rdiv_in: [1, 2, 3]
    required_all:
      - p1)R_1_2_2                 # 직원수
    required_any:                  # 교육예산 OR 집행 중 1개 이상
      - p1)R_1_4_2                 # 교육예산
      - p1)R_1_5_2                 # 교육경비 집행
  public:                          # 공공 모집단 (R_Div 4·5, 별도 집계)
    rdiv_in: [4, 5]
    required_all:
      - p1)R_1_2_2                 # 직원수 (매출 면제)
  optional_exclusion_column: excluded_from_kim
  optional_exclusion_value: true

# ─────────────────────────────────────────────
# 시트 정의 (v1 = 7시트)
# ─────────────────────────────────────────────
sheets:
  - name: 전체
    filter: all              # 기업 모집단 전체
    population: corporate

  - name: 100미만
    filter: emp_range
    population: corporate
    min_inclusive: 0
    max_exclusive: 100

  - name: 100-300
    filter: emp_range
    population: corporate
    min_inclusive: 100
    max_exclusive: 300

  - name: 300-500
    filter: emp_range
    population: corporate
    min_inclusive: 300
    max_exclusive: 500

  - name: 500-1000
    filter: emp_range
    population: corporate
    min_inclusive: 500
    max_exclusive: 1000

  - name: 1000이상
    filter: emp_range
    population: corporate
    min_inclusive: 1000
    max_exclusive: null

  - name: 공공조직
    filter: all              # public 모집단 자체가 R_Div 4·5
    population: public

# ─────────────────────────────────────────────
# 업종 세그먼트 (수기 재분류 후 활성 — 프레임워크는 지금, 데이터는 재분류 후 자동 활성)
# ─────────────────────────────────────────────
industry:
  enabled: false            # R_Cate etc(기타 18)/미분류 ~33% 수기 재분류 완료 후 true 전환
  source: R_Cate            # 업종코드
  population: corporate      # 기업 한정
  column_group: 1           # options/options_order 출처 (아래 column_groups id:1)
  min_n: 10                 # 소표본 게이트: N≥10 업종만 산출 (④ XLSX 시트 + ⑤ HTML 섹션 자동 포함)
  # NOTE: true 전환 시 ④ stage4_build_kim_xlsx / ⑤ stage5_render_segment_report 가
  #       industry_segments() 로 N≥min_n 업종을 자동 추가. 재분류 전엔 placeholder 만 노출.

# ─────────────────────────────────────────────
# 컬럼 그룹 (v1 = 4개; 5)예산변동은 raw 매핑 추가 검증 후 v1.1)
# ─────────────────────────────────────────────
column_groups:
  - id: 1
    label: "1)업종"
    source: R_Cate
    type: categorical
    sheet_col_offset: 6   # 김태웅 시트의 col index (라벨)
    options:
      # raw R_Cate 코드 → 김태웅 한글 라벨
      "1":   전자/반도체/통신
      "2":   건설
      "3":   자동차/철강
      "4":   항공/철도/조선
      "5":   에너지/환경/화학
      "6":   패션/유통/식품
      "7":   의료/제약/바이오
      "8":   금융/은행/보험
      "9":   IT/Software
      "10":  교육/연구
      "11":  여행/관광/레저
      "12":  아동/청소년/복지
      "13":  일반 서비스
      "etc": 기업기타       # NOTE: 분석가 수기 재분류 시 변경
      # 공공 라벨은 R_Div 기준 별도
    options_order:
      - 전자/반도체/통신
      - 건설
      - 자동차/철강
      - 항공/철도/조선
      - 에너지/환경/화학
      - 패션/유통/식품
      - 의료/제약/바이오
      - 금융/은행/보험
      - IT/Software
      - 교육/연구
      - 여행/관광/레저
      - 아동/청소년/복지
      - 일반 서비스
      - 기업기타
      - 중앙부처
      - 지자체
      - 공공기관
      - 공공기타
    # 공공 분류 룰: R_Div=4 → 공공기관, R_Div=5 → 공공기타 (학교)
    # (R_Cate 가 NaN 인 응답자만 적용)
    public_rule:
      4: 공공기관
      5: 공공기타

  - id: 0
    label: "0)조직구분"
    source: R_Div
    type: categorical
    # raw R_Div 코드 → 라벨 (codebook 22th 기준)
    options:
      "1": 대기업
      "2": 중기업
      "3": 소기업
      "4": 공공기관
      "5": 학교
    options_order:
      - 대기업
      - 중기업
      - 소기업
      - 공공기관
      - 학교

  - id: 2
    label: "2)인력규모"
    source: p1)R_1_2_2
    type: numeric_range
    sheet_col_offset: 8
    bins: [0, 100, 300, 500, 1000, null]
    labels: ["100미만", "100-300", "300-500", "500-1000", "1000이상"]

  - id: 3
    label: "3)예상매출"
    source: p1)R_1_1_2
    type: numeric_range
    sheet_col_offset: 10
    # 1억 단위 환산: 200억 = 200e8, 5000억 = 5000e8
    bins: [0, 20000000000, 50000000000, 100000000000, 500000000000, null]
    labels: ["200억미만", "200-500억", "500-1000억", "1000-5000억", "5000억이상"]
    # NOTE: 김태웅 6구간이지만 실제로는 5개? 추후 검증

  - id: 4
    label: "4)교육예산"
    source: p1)R_1_5_2
    type: numeric_range
    sheet_col_offset: 12
    # 5000만원미만 / 5000-1억 / 1-3억 / 3-5억 / 5-10억 / 10-20억 / 20억이상
    bins: [0, 50000000, 100000000, 300000000, 500000000, 1000000000, 2000000000, null]
    labels: ["5000만원미만", "5000-1억", "1-3억", "3-5억", "5-10억", "10-20억", "20억이상"]
