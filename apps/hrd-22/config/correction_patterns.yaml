# 21회 정정 사례 학습 결과 — 분석가 참고용 (자동 정정 안 함)
#
# 매년 분석가가 정제 단계에서 참고. 22회 신규 사례 발견 시 이 파일에 추가.

source: 21회 raw vs cleaned 매칭 (218건 overlap 기준)
total_corrections: 21

# ─────────────────────────────────────────────
# 매출 (p1)R_1_1_2) — 12건 정정
# ─────────────────────────────────────────────
matrix_revenue:
  - case: raw=0 → 값 채움
    count: 6
    raw_value: 0
    pattern: "응답자 후속 확인 후 분석가가 값 입력"
    action_for_analyst: "응답자 메일/전화로 매출 확인 → 정정"

  - case: 단위 ×1억 보정 (raw 가 억원 단위로 입력됨)
    count: 5
    raw_range: [800, 10000]
    clean_range: [80_000_000_000, 1_000_000_000_000]
    multiplier: 100_000_000   # × 1억
    pattern: "raw 가 4자리 이하 정수 → 분석가가 ×1억 단위로 인식하고 정정"
    examples:
      - raw: 8549,    clean: 854_900_000_000
      - raw: 870,     clean: 87_601_340_000
      - raw: 7526,    clean: 752_688_100_000
      - raw: 1160,    clean: 116_000_000_000

  - case: 단위 ×1000 보정 (raw 가 500M, 정정 500B)
    count: 1
    raw_value: 500_000_000
    clean_value: 500_000_000_000

# ─────────────────────────────────────────────
# 교육예산 (p1)R_1_5_2) — 9건 정정
# ─────────────────────────────────────────────
matrix_budget:
  - case: raw=0 → 값 채움
    count: 5
    action_for_analyst: "후속 확인"

  - case: 단위 ×1억 보정 (raw=7 → 7억)
    count: 1
    raw_value: 7
    clean_value: 700_000_000
    multiplier: 100_000_000

  - case: 단위 ×0.1 (raw 30억 → 3억, 0 하나 더 붙은 오류)
    count: 1
    raw_value: 3_000_000_000
    clean_value: 300_000_000

  - case: 단위 ×0.01 (raw 58.9억 → 5.89억, ×100 오류)
    count: 1
    raw_value: 58_877_910_000
    clean_value: 588_779_100

  - case: 무효 처리 (raw=5 → 0)
    count: 1
    raw_value: 5
    clean_value: 0
    pattern: "응답 무효 판정"

