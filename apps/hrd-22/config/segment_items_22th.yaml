# 세그먼트 분석 문항 인벤토리 — 2026 설문 기준 (docs/SEGMENT_FULL_ITEMS_SPEC_22th.md)
#
# 두 산출물의 공통 기반:
#   - XLSX(데이터수준 종합): html != 제외 인 전 문항 × (전체·규모5·공공·업종)
#   - HTML(하이라이트): html == 핵심 만 본문, 부록은 접기
#
# 라벨·코드맵(예: 1=교육인원증가 …)은 config 에 중복 보관하지 않고
# 집계기 scripts/segment_aggregate.py 가 코드북 0_survey/codebook_22th.xlsx 에서 런타임 도출:
#   - dist/multi/dist_multi : '코드표' 응답형식의 'n=라벨' 파싱
#   - mean_pct/mean_pct_cf/likert/likert_iv/mean/tenure_ym : '코드표' 하위항목
#   - issue_rank/issue_multi : 'HRD이슈_항목코드' 시트(A그룹 _n_2_che / B그룹 _n_4_che, 코드 1~15)
#
# agg 종류 (scripts/segment_aggregate.py:aggregate):
#   macro       = 5거시지표 mean+median (원/명)
#   mean        = 숫자 평균(+중앙값)
#   tenure_ym   = '년-월' 형식 → 개월 환산 평균/중앙값 (HRD 경력 전용)              [신규]
#   mean_pct    = % 항목들 평균(형태/지출/직책 등, 합~100)
#   mean_pct_cf = 현재(_3)/향후(_4) 쌍 → 항목별 현재·향후 평균% (Ⅲ HRD활동 다수)     [신규]
#   dist        = 단일선택 분포
#   dist_multi  = 다항목 각각 단일선택 분포 + 실시율(4=실시중) (Ⅱ 제도현황)            [신규]
#   multi_rate  = 복수응답 선택률
#   likert      = 1~5 척도 mean+분포
#   likert_iv   = 중요도/수행도(또는 2-col) 쌍 mean+분포+gap                          [신규]
#   issue_rank  = p4 주요이슈 cheOrder('순위)항목_그룹' 2=A·4=B) 파싱 → 순위분포+언급률 [신규]
#   issue_multi = p4 기타이슈 A그룹(_n_2_che)·B그룹(_n_4_che) 쉼표복수 선택률          [신규]
#
# ── ② 코드북 검증 결과 (2026-05-29, verify 전건 해소) ──
# 모든 명시 cols 가 raw_validated(243컬럼)에 존재. 와일드카드는 집계기가 코드북으로 전개하며
# 응답형식='텍스트'(_etc 입력칸)는 자동 제외. 확인된 코드북 quirk(집계기가 처리):
#   (A) hrd_staff: p2)R_1_4_3~_6_3 은 '숫자(명)'이 아니라 '년-월 형식'(경력) → 인원/경력 문항 분리.
#   (B) edu_content: p3)R_1_7(저성과자)·p3)R_1_9(저성과자) 라벨 중복 → 집계기가 동일라벨 합산.
#   (C) remote_demand(구 refund): p3)R_11_multi 는 '고용보험 환급'이 아니라 '원격교육 수요전망'(1확대/2변동없음/3축소).
#   (D) issue_rank/issue_etc: p4)R_1·R_2 는 단일컬럼이 아니라 A그룹(_n_2_che)/B그룹(_n_4_che)+순위(cheOrder) 구조.
#   (E) perf_link: p4)R_3 _3/_4 접미는 현재/향후가 아니라 '중요도/수행도'.
#   (F) perf_barrier: 컬럼은 p4)R_4_n_3_rad (단일선택), p4)R_4_6_etc 는 텍스트.
#   (G) HRD이슈 코드 자체 quirk: A그룹9='세대간 협업'(스펙상 축소표현 유지), B그룹6·7 둘 다 'CDP' 라벨 중복.

