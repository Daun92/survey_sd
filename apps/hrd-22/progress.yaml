# 22회 인재개발 실태조사 - 단일 진척 데이터 소스
#
# 이 파일이 진척 관리의 single source of truth.
# 수정 후 `python scripts/update_dashboard.py` 실행 → docs/PROGRESS.md + dashboard/index.html 동기화
#
# status 값: not_started | in_progress | completed | blocked
# progress: 0~100 (%)

project:
  name: 제22회 인재개발 실태조사
  year_publish: 2026
  status: in_progress
  started_at: "2026-05-15"
  target_publish: "2026-09"
  notes: |
    22회 raw 응답 수집 시작 예정 (2026-06 중순).
    수집 종료 후 단계 2~5 가동.

milestones:
  - date: "2026-05-15"
    label: 프로젝트 시작 / 디렉토리 골격 완료
    status: completed
  - date: "2026-06-12"
    label: 단계 0 (설문 검수·codebook·가이드) 확정
    status: pending
  - date: "2026-06-15"
    label: 응답 수집 시작
    status: pending
  - date: "2026-08-01"
    label: 응답 수집 종료 (가정)
    status: pending
  - date: "2026-08-15"
    label: 단계 3 (정제 DB) 완료
    status: pending
  - date: "2026-09-15"
    label: 최종 PDF 발간
    status: pending

stages:
  - id: 0
    name: 설문 초안 검수
    role: 분석가 (자동 80%)
    description: 22회 설문 초안의 변경분 식별, codebook·가이드 22회 patch
    status: in_progress
    progress: 80
    eta: "2026-06-12"
    deliverables:
      - id: survey_draft
        name: 22회 설문 초안 v0.2 배치
        path: 0_survey/survey_draft_v0.2.pptx
        status: completed
      - id: stage0_diff
        name: 변경분 식별 스크립트
        path: scripts/stage0_diff_survey.py
        status: completed
      - id: change_log
        name: 변경 이력 리포트 (1차 자동 분류 완료)
        path: 0_survey/change_log_21_22.md
        status: completed
      - id: codebook_patch
        name: 22회 codebook (243컬럼, Part V 16/Part I R_11 신규)
        path: 0_survey/codebook_22th.xlsx
        status: completed
      - id: guide_patch
        name: 22회 분석가이드 (21회 사본 + 변경 notes 분석가 인계)
        path: 0_survey/analysis_guide_22th.xlsx
        status: in_progress
      - id: guide_change_notes
        name: 분석가 인계용 변경 notes
        path: 0_survey/guide_change_notes.md
        status: completed

  - id: 1
    name: 응답 수집
    role: 응답자 (웹앱)
    description: survey_sd 웹앱으로 응답 수집 + admin/hrd 대시보드 모니터링
    status: not_started
    progress: 0
    eta: "2026-08-01"
    deliverables:
      - id: raw_export
        name: raw 응답 export
        path: 1_raw/raw_22th.xlsx
        status: not_started

  - id: 2
    name: Raw 검증·이상치 자동 플래그
    role: 자동 (95%)
    description: drift 검증·완료 필터·단위 오류/극값 이상치 후보 산출
    status: in_progress
    progress: 80
    eta: "2026-08-02"
    deliverables:
      - id: validate_script
        name: 검증 스크립트 (drift + 완료필터 + 통계)
        path: scripts/stage2_validate_raw.py
        status: completed
      - id: outlier_script
        name: 이상치 플래그 스크립트 (recall 90%)
        path: scripts/stage2_flag_outliers.py
        status: completed
      - id: outlier_rules
        name: 이상치 규칙 (single+cross_column+respondent)
        path: config/outlier_rules.yaml
        status: completed
      - id: correction_patterns
        name: 21회 정정 패턴 학습 (21건)
        path: config/correction_patterns.yaml
        status: completed
      - id: recall_test
        name: 21회 reverse-run recall 검증
        path: tests/test_stage2_recall.py
        status: completed
      - id: raw_validated
        name: 검증 통과 raw (22회 raw 도착 시)
        path: 2_validated/raw_validated.xlsx
        status: not_started
      - id: outlier_report
        name: 이상치 리포트 (22회 raw 도착 시)
        path: 2_validated/outlier_report.xlsx
        status: not_started

  - id: 3
    name: 정제 DB 작성 (분석가 검수)
    role: 분석가 (자동 30%)
    description: 이상치 검토·단위 보정·5항목 응답 필터 적용
    status: in_progress
    progress: 33
    eta: "2026-08-15"
    deliverables:
      - id: cleaning_manual
        name: 분석가 검수 매뉴얼 (작업 흐름·정정 사례·체크리스트)
        path: docs/CLEANING_MANUAL.md
        status: completed
      - id: cleaned_db
        name: 정제 DB (raw 도착 후 분석가 작업)
        path: 3_cleaned/All_확인완료_22th.xlsx
        status: not_started
      - id: corrections_log
        name: 정정 이력 (raw 도착 후)
        path: 3_cleaned/corrections_log.xlsx
        status: not_started

  - id: 4
    name: 집계표·도표 데이터 산출
    role: 자동 (100%)
    description: 16시트 김태웅 형식 + 도표 48개 chart_data JSON 자동 생성
    status: in_progress
    progress: 45
    eta: "2026-08-16"
    deliverables:
      - id: segments_config
        name: 세그먼트 매핑 v1.1 (분석가 제외 표시 옵션 포함)
        path: config/segments.yaml
        status: completed
      - id: chart_specs
        name: 도표 48개 사양 (가이드 → YAML)
        path: config/chart_specs.yaml
        status: not_started
      - id: build_kim
        name: 김태웅 형식 집계기 v1.1 (모집단 제외 표시 지원)
        path: scripts/stage4_build_kim_xlsx.py
        status: completed
      - id: chart_data
        name: 도표 데이터 추출기
        path: scripts/stage4_extract_chart_data.py
        status: not_started
      - id: kim_validation
        name: 21회 reverse-run 검증 (비율 ±5pp 94%, ±2pp 65%)
        path: tests/test_stage4_with_21th.py
        status: completed
      - id: industry_v2
        name: 산업 10시트 v2 (분석가 수기 분류 보조)
        path: scripts/stage4_industry_v2.py
        status: not_started
      - id: kim_xlsx
        name: 22회 김태웅 형식 집계
        path: 4_aggregated/김태웅_22th.xlsx
        status: not_started
      - id: chart_json
        name: 도표 데이터 JSON
        path: 4_aggregated/chart_data_22th.json
        status: not_started

  - id: 5
    name: PPT 생성·검수·발간
    role: 분석가 + 디자이너 (자동 50%)
    description: master_22th 채우기 → 디자이너 검수 → 분석가 최종 → PDF
    status: not_started
    progress: 0
    eta: "2026-09-15"
    deliverables:
      - id: master_pptx
        name: 22회 master PPTX
        path: 5_report/master_22th.pptx
        status: not_started
      - id: render_script
        name: PPT 자동 채우기 스크립트
        path: scripts/stage5_render_pptx.py
        status: not_started
      - id: orchestrator
        name: 전체 파이프라인 orchestrator
        path: scripts/run_pipeline.py
        status: not_started
      - id: result_pptx
        name: 22회 결과보고서 PPTX
        path: 5_report/result_22th.pptx
        status: not_started
      - id: result_pdf
        name: 22회 결과보고서 PDF (최종)
        path: 5_report/result_22th.pdf
        status: not_started
