[project]
name = "hrd-survey-22th"
version = "0.1.0"
description = "제22회 인재개발 실태조사 (2026 발간) - 단계별 파이프라인 + 분석가 워크스페이스"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-pptx>=0.6.21",
    "pdfplumber>=0.10",  # PDF 비교용
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
